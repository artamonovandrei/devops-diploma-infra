apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-webstrike
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  webstrike.json: |
    {
      "title": "webstrike Overview",
      "uid": "devops-diploma-ms",
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Pods Running (webstrike)",
          "gridPos": { "h": 4, "w": 8, "x": 0, "y": 0 },
          "targets": [
            {
              "expr": "count(kube_pod_status_phase{namespace=\"webstrike\", phase=\"Running\"})",
              "legendFormat": "Running"
            }
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "CPU Usage by Pod",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 4 },
          "targets": [
            {
              "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"webstrike\", container!=\"\"}[5m])) by (pod)",
              "legendFormat": "{{pod}}"
            }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Memory Usage by Pod",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 4 },
          "targets": [
            {
              "expr": "sum(container_memory_working_set_bytes{namespace=\"webstrike\", container!=\"\"}) by (pod)",
              "legendFormat": "{{pod}}"
            }
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Pod Restarts",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 12 },
          "targets": [
            {
              "expr": "increase(kube_pod_container_status_restarts_total{namespace=\"webstrike\"}[1h])",
              "legendFormat": "{{pod}}"
            }
          ]
        }
      ]
    }

