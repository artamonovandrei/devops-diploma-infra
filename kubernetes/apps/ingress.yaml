# Opcjonalny Ingress Traefik — główny dostęp do gry to NodePort 30080 (Service web).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: webstrike-ingress
  namespace: webstrike
  annotations:
    kubernetes.io/ingress.class: traefik
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
