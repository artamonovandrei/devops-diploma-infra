# Jenkins Configuration as Code — przykład

jenkins:
  systemMessage: "DevOps Diploma - WebStrike CI/CD"
  numExecutors: 2
  mode: NORMAL

credentials:
  system:
    domainCredentials:
      - credentials:
          - usernamePassword:
              scope: GLOBAL
              id: "dockerhub-credentials"
              username: "${DOCKERHUB_USER}"
              password: "${DOCKERHUB_TOKEN}"
              description: "Docker Hub credentials"
          - usernamePassword:
              scope: GLOBAL
              id: "ses-smtp"
              username: "${SES_SMTP_USER}"
              password: "${SES_SMTP_PASS}"
              description: "AWS SES SMTP credentials"

unclassified:
  location:
    url: "http://JENKINS_PUBLIC_IP:8080/"
  mailer:
    smtpHost: "email-smtp.eu-central-1.amazonaws.com"
    smtpPort: "587"
    useSsl: false
    useTls: true
    charset: "UTF-8"
    authentication: "ses-smtp"
    replyToAddress: "artamonovandrei88@gmail.com"
  email-ext:
    defaultRecipients: "artamonovandrei88@gmail.com"
    defaultReplyTo: "artamonovandrei88@gmail.com"
    defaultSubject: "[DevOps Diploma] $PROJECT_NAME - Build #${BUILD_NUMBER} - ${BUILD_STATUS}"
    defaultBody: |
      Build: ${BUILD_URL}
      Status: ${BUILD_STATUS}
      Branch: ${GIT_BRANCH}

jobs:
  - script: >
      multibranchPipelineJob('webstrike') {
        branchSources {
          github {
            id('counter-strike')
            scanCredentialsId('github-token')
            repoOwner('artamonovandrei')
            repository('Counter-Strike')
          }
        }
        factory {
          workflowBranchProjectFactory {
            scriptPath('Jenkinsfile')
          }
        }
        triggers {
          periodic(120)
        }
      }
