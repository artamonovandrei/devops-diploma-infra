---
- name: Deploy monitoring stack (Prometheus + Grafana + Loki) on k3s
  hosts: k3s
  become: true
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

  tasks:
    - name: Ensure monitoring scripts/manifests directory on host
      file:
        path: /opt/devops-diploma-infra
        state: directory
        mode: "0755"

    - name: Sync infra repo checkout for manifests (if present)
      stat:
        path: /opt/devops-diploma-infra/.git
      register: infra_git

    - name: Update infra git checkout
      when: infra_git.stat.exists
      shell: |
        set -e
        git -C /opt/devops-diploma-infra fetch --depth 1 origin main
        git -C /opt/devops-diploma-infra reset --hard origin/main
      changed_when: true

    - name: Copy monitoring manifests from controller
      copy:
        src: "{{ playbook_dir }}/../../kubernetes/monitoring/"
        dest: /opt/devops-diploma-infra/kubernetes/monitoring/
        mode: "0644"

    - name: Copy install-monitoring-lite.sh
      copy:
        src: "{{ playbook_dir }}/../../scripts/install-monitoring-lite.sh"
        dest: /opt/devops-diploma-infra/scripts/install-monitoring-lite.sh
        mode: "0755"

    - name: Install lite monitoring (Prometheus NodePort 30090, Grafana 30300)
      command: /opt/devops-diploma-infra/scripts/install-monitoring-lite.sh
      register: mon
      changed_when: "'MONITORING_OK' in mon.stdout"

    - name: Show monitoring endpoints
      debug:
        msg: "{{ mon.stdout_lines | default([]) | select('search', 'http') | list }}"
