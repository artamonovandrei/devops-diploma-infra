---
- name: Install Prometheus + Grafana (simple stack)
  hosts: k3s
  become: true
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

  tasks:
    - name: Ensure infra directories
      file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /opt/devops-diploma-infra/scripts
        - /opt/devops-diploma-infra/kubernetes/monitoring

    - name: Sync monitoring stack from controller
      copy:
        src: "{{ playbook_dir }}/../../kubernetes/monitoring/stack.yaml"
        dest: /opt/devops-diploma-infra/kubernetes/monitoring/stack.yaml
        mode: "0644"

    - name: Sync install script (normalize CRLF from Windows mount)
      copy:
        src: "{{ playbook_dir }}/../../scripts/install-monitoring-lite.sh"
        dest: /opt/devops-diploma-infra/scripts/install-monitoring-lite.sh
        mode: "0755"

    - name: Strip Windows CRLF from install script
      replace:
        path: /opt/devops-diploma-infra/scripts/install-monitoring-lite.sh
        regexp: '\r\n?'
        replace: '\n'

    - name: Apply Prometheus + Grafana
      # bash explicite — unika Errno 2 przy shebang z CRLF / brak +x
      shell: bash /opt/devops-diploma-infra/scripts/install-monitoring-lite.sh
      args:
        executable: /bin/bash
      register: mon
      changed_when: "'MONITORING_OK' in mon.stdout"

    - name: Show install output
      debug:
        msg: "{{ mon.stdout_lines }}"
