---
- name: Install Prometheus + Grafana (simple stack)
  hosts: k3s
  become: true
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

  tasks:
    - name: Ensure infra checkout directory
      file:
        path: /opt/devops-diploma-infra/scripts
        state: directory
        mode: "0755"

    - name: Ensure monitoring manifests directory
      file:
        path: /opt/devops-diploma-infra/kubernetes/monitoring
        state: directory
        mode: "0755"

    - name: Sync monitoring stack from controller
      copy:
        src: "{{ playbook_dir }}/../../kubernetes/monitoring/stack.yaml"
        dest: /opt/devops-diploma-infra/kubernetes/monitoring/stack.yaml
        mode: "0644"

    - name: Sync install script
      copy:
        src: "{{ playbook_dir }}/../../scripts/install-monitoring-lite.sh"
        dest: /opt/devops-diploma-infra/scripts/install-monitoring-lite.sh
        mode: "0755"

    - name: Apply Prometheus + Grafana
      command: /opt/devops-diploma-infra/scripts/install-monitoring-lite.sh
      register: mon
      changed_when: "'MONITORING_OK' in mon.stdout"

    - name: Show URLs
      debug:
        msg: "{{ mon.stdout_lines | select('search', 'http') | list }}"
