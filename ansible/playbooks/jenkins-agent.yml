---
- name: Configure Jenkins agent on k3s node
  hosts: k3s
  become: true
  vars:
    jenkins_master_url: "http://JENKINS_PRIVATE_IP:8080"
    agent_name: "k3s-agent"

  tasks:
    - name: Install Java for Jenkins agent
      apt:
        name: openjdk-17-jdk
        state: present

    - name: Ensure Python 3.10 present on agent
      apt:
        name:
          - python3.10
          - python3.10-venv
          - python3-pip
        state: present

    - name: Create jenkins agent directory
      file:
        path: /opt/jenkins-agent
        state: directory
        owner: ubuntu
        mode: "0755"

    - name: Install Docker on k3s node for agent builds
      apt:
        name:
          - docker.io
        state: present

    - name: Add ubuntu to docker group
      user:
        name: ubuntu
        groups: docker
        append: true

    - name: Clone devops infra repo on k3s
      git:
        repo: "{{ devops_repo_url | default('https://github.com/YOUR_USER/devops-diploma-infra.git') }}"
        dest: /opt/devops-diploma-infra
        version: main
      become_user: ubuntu

    - name: Display agent setup instructions
      debug:
        msg: |
          Jenkins agent setup:
          1. W Jenkins: Manage Jenkins -> Nodes -> New Node
          2. Name: k3s-agent, Type: Permanent Agent
          3. Remote root: /opt/jenkins-agent
          4. Labels: k3s-agent
          5. Launch method: Launch agents via SSH
          6. Host: {{ ansible_host }}, User: ubuntu, Key: devops-diploma
