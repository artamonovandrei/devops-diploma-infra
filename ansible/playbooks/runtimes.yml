---
# Python 3.12 + Node.js 22 on all project servers (matches WebStrike Dockerfiles)
- name: Install application runtimes (Python 3.12 + Node 22)
  hosts: all
  become: true
  vars:
    node_major: "22"
    python_version: "3.12"

  tasks:
    - name: Update apt cache
      apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install software-properties-common
      apt:
        name: software-properties-common
        state: present

    - name: Add deadsnakes PPA for Python {{ python_version }}
      apt_repository:
        repo: ppa:deadsnakes/ppa
        state: present
        update_cache: true

    - name: Install Python {{ python_version }} packages
      apt:
        name:
          - "python{{ python_version }}"
          - "python{{ python_version }}-venv"
          - "python{{ python_version }}-dev"
          - python3-pip
          - python3-setuptools
        state: present

    - name: Ensure python3 points to Python {{ python_version }}
      alternatives:
        name: python3
        link: /usr/bin/python3
        path: "/usr/bin/python{{ python_version }}"
        priority: 1200

    - name: Ensure python points to Python {{ python_version }}
      alternatives:
        name: python
        link: /usr/bin/python
        path: "/usr/bin/python{{ python_version }}"
        priority: 1200

    - name: Bootstrap pip for Python {{ python_version }}
      command: "/usr/bin/python{{ python_version }} -m ensurepip --upgrade"
      changed_when: true
      failed_when: false

    - name: Upgrade pip for Python {{ python_version }}
      command: "/usr/bin/python{{ python_version }} -m pip install --upgrade pip setuptools wheel"
      changed_when: true

    - name: Install pytest for CI on Jenkins host
      command: "/usr/bin/python{{ python_version }} -m pip install pytest requests httpx"
      when: "'jenkins' in group_names"
      changed_when: true

    - name: Download NodeSource setup for Node.js {{ node_major }}
      get_url:
        url: "https://deb.nodesource.com/setup_{{ node_major }}.x"
        dest: /tmp/nodesource_setup.sh
        mode: "0755"

    - name: Add NodeSource repository
      command: bash /tmp/nodesource_setup.sh
      args:
        creates: /etc/apt/sources.list.d/nodesource.list

    - name: Install Node.js {{ node_major }}
      apt:
        name: nodejs
        state: present
        update_cache: true

    - name: Verify runtime versions
      shell: |
        set -e
        echo "python3=$(python3 --version)"
        echo "python=$(python --version 2>&1 || true)"
        echo "pip=$(python3 -m pip --version)"
        echo "node=$(node --version)"
        echo "npm=$(npm --version)"
        python3 -c "import sys; assert sys.version_info[:2] == (3, 12), sys.version"
        node -e "const v=process.versions.node.split('.')[0]; if (v!=='22') { console.error(process.versions.node); process.exit(1) }"
      register: runtime_versions
      changed_when: false

    - name: Show installed runtimes
      debug:
        var: runtime_versions.stdout_lines
