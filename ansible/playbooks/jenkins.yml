---
- name: Configure Jenkins server
  hosts: jenkins
  become: true
  vars:
    java_package: openjdk-21-jre
    jenkins_home: /var/lib/jenkins
    jenkins_mount: /mnt/jenkins-home

  tasks:
    - name: Update apt cache
      apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install base packages
      apt:
        name:
          - "{{ java_package }}"
          - fontconfig
          - curl
          - wget
          - gnupg
          - apt-transport-https
          - ca-certificates
          - software-properties-common
          - python3-pip
          - git
          - unzip
          - xfsprogs
          - rsync
        state: present

    - name: Install Docker
      block:
        - name: Add Docker GPG key
          apt_key:
            url: https://download.docker.com/linux/ubuntu/gpg
            state: present

        - name: Add Docker repository
          apt_repository:
            repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu jammy stable"
            state: present

        - name: Install Docker packages
          apt:
            name:
              - docker-ce
              - docker-ce-cli
              - containerd.io
            state: present

        - name: Add ubuntu user to docker group
          user:
            name: ubuntu
            groups: docker
            append: true

        - name: Enable and start Docker
          systemd:
            name: docker
            state: started
            enabled: true

    - name: Install Terraform
      block:
        - name: Download Terraform
          get_url:
            url: "https://releases.hashicorp.com/terraform/1.9.8/terraform_1.9.8_linux_amd64.zip"
            dest: /tmp/terraform.zip

        - name: Unzip Terraform
          unarchive:
            src: /tmp/terraform.zip
            dest: /usr/local/bin
            remote_src: true
            mode: "0755"

    - name: Install kubectl
      get_url:
        url: "https://dl.k8s.io/release/v1.31.2/bin/linux/amd64/kubectl"
        dest: /usr/local/bin/kubectl
        mode: "0755"

    - name: Install AWS CLI v2
      block:
        - name: Download AWS CLI
          get_url:
            url: "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip"
            dest: /tmp/awscliv2.zip

        - name: Unzip AWS CLI
          unarchive:
            src: /tmp/awscliv2.zip
            dest: /tmp
            remote_src: true

        - name: Install AWS CLI
          command: /tmp/aws/install
          args:
            creates: /usr/local/bin/aws

    # ── Persistent EBS for Jenkins home ─────────────────────────────────────
    - name: Check if /var/lib/jenkins already bind-mounted
      command: findmnt -n {{ jenkins_home }}
      register: jenkins_home_mnt
      changed_when: false
      failed_when: false

    - name: Prepare persistent Jenkins volume
      when: jenkins_home_mnt.rc != 0
      block:
        - name: Find unmounted data disk (not root)
          shell: |
            set -e
            root_src=$(findmnt -n -o SOURCE / | sed 's/p[0-9]*$//')
            for d in /dev/nvme*n1 /dev/xvd[f-z] /dev/sd[f-z]; do
              [ -b "$d" ] || continue
              case "$d" in
                "$root_src"|/dev/nvme0n1|/dev/xvda|/dev/sda) continue ;;
              esac
              if ! findmnt -n "$d" >/dev/null 2>&1; then
                echo "$d"
                exit 0
              fi
            done
            # already mounted at jenkins_mount?
            if findmnt -n "{{ jenkins_mount }}" >/dev/null 2>&1; then
              findmnt -n -o SOURCE "{{ jenkins_mount }}"
              exit 0
            fi
            exit 1
          args:
            executable: /bin/bash
          register: jenkins_disk
          changed_when: false
          retries: 36
          delay: 5
          until: jenkins_disk.rc == 0

        - name: Check filesystem on data disk
          command: "blkid -o value -s TYPE {{ jenkins_disk.stdout }}"
          register: jenkins_fs
          changed_when: false
          failed_when: false

        - name: Format data disk (first time only)
          filesystem:
            fstype: xfs
            dev: "{{ jenkins_disk.stdout }}"
          when: jenkins_fs.stdout | length == 0

        - name: Create mount point
          file:
            path: "{{ jenkins_mount }}"
            state: directory
            mode: "0755"

        - name: Mount Jenkins data volume
          mount:
            path: "{{ jenkins_mount }}"
            src: "{{ jenkins_disk.stdout }}"
            fstype: xfs
            opts: defaults,nofail
            state: mounted

        - name: Stop Jenkins before migrating home
          systemd:
            name: jenkins
            state: stopped
          failed_when: false

        - name: Migrate root Jenkins home onto empty data volume
          shell: |
            set -e
            if [ -d {{ jenkins_home }} ] && [ ! -f {{ jenkins_mount }}/config.xml ]; then
              rsync -a {{ jenkins_home }}/ {{ jenkins_mount }}/
            fi
          args:
            executable: /bin/bash

        - name: Ensure bind target exists
          file:
            path: "{{ jenkins_home }}"
            state: directory
            mode: "0755"

        - name: Bind-mount data volume onto /var/lib/jenkins
          mount:
            path: "{{ jenkins_home }}"
            src: "{{ jenkins_mount }}"
            fstype: none
            opts: bind
            state: mounted

    - name: Install Jenkins
      block:
        - name: Ensure apt keyrings directory exists
          file:
            path: /etc/apt/keyrings
            state: directory
            mode: "0755"

        - name: Download Jenkins 2026 GPG key
          get_url:
            url: https://pkg.jenkins.io/debian-stable/jenkins.io-2026.key
            dest: /etc/apt/keyrings/jenkins-keyring.asc
            mode: "0644"

        - name: Add Jenkins apt source list
          copy:
            dest: /etc/apt/sources.list.d/jenkins.list
            content: "deb [signed-by=/etc/apt/keyrings/jenkins-keyring.asc] https://pkg.jenkins.io/debian-stable binary/\n"
            mode: "0644"

        - name: Install Jenkins package
          apt:
            name: jenkins
            state: present
            update_cache: true

        - name: Ensure jenkins home ownership
          file:
            path: "{{ jenkins_home }}"
            state: directory
            owner: jenkins
            group: jenkins
            recurse: true

        - name: Add jenkins user to docker group
          user:
            name: jenkins
            groups: docker
            append: true

        - name: Enable and start Jenkins
          systemd:
            name: jenkins
            state: started
            enabled: true

    - name: Configure UFW firewall
      block:
        - name: Allow SSH
          ufw:
            rule: allow
            port: "22"
            proto: tcp

        - name: Allow Jenkins UI
          ufw:
            rule: allow
            port: "8080"
            proto: tcp

        - name: Allow Jenkins agent JNLP
          ufw:
            rule: allow
            port: "50000"
            proto: tcp

        - name: Enable UFW
          ufw:
            state: enabled
            policy: deny
            direction: incoming

    - name: Wait for Jenkins to start
      uri:
        url: "http://localhost:8080/login"
        status_code: 200
      register: jenkins_ready
      until: jenkins_ready.status == 200
      retries: 30
      delay: 10

    - name: Persistence reminder
      debug:
        msg: "Jenkins home is on persistent EBS. Before terraform destroy run: .\\scripts\\aws-pause.ps1"
